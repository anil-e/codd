[package]
name = "codd"
version = "0.8.0"
edition = "2024"
rust-version = "1.93"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto", "tracing"] }
relm4 = { version = "0.11", features = ["libadwaita", "macros"] }
libadwaita = { version = "0.9.1", features = ["v1_8"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["chrono", "macros", "postgres", "runtime-tokio-rustls"] }
sqlx-core = { version = "0.8.6", default-features = false }
sourceview5 = "0.11.0"
tokio = { version = "1.52.0", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }
